# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  # Loads the mod with the pinned Amplified Nether jar and checks that the mixin applies.
  # The EULA is never accepted, so the server exits right after mod initialization.
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: download reference jar
        run: python3 verification/download_reference.py
      - name: run smoke server
        run: timeout 15m ./gradlew -ProofSmoke runServer --console=plain 2>&1 | tee smoke.log
      - name: check smoke marker
        run: |
          grep -q NETHER_ROOF_SMOKE_OK smoke.log
          if grep -E "InvalidInjectionException|MixinApplyError|InvalidMixinException" smoke.log; then exit 1; fi
      - name: upload smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-log
          path: smoke.log
